name: Verificação local e privacidade
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regressao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run demo
      - run: npm run workflows:build
      - run: npm run check
